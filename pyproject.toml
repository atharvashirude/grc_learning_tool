[tool.poetry]
name = "grc-learning-tool"
version = "0.1.0"
description = "Interactive GRC Learning Platform with ISO 27001 Simulations and AI Orchestration"
authors = ["Atharva Shirude"]
license = "MIT"
readme = "README.md"
packages = [{ include = "grc_tool", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pydantic = "^2.8.0"
langgraph = ">=0.2.0"
langchain-core = ">=0.3.0"
httpx = ">=0.27.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
mypy = "^1.11.0"
pytest = ">=9.0.3"
pytest-asyncio = ">=1.0.0"
pytest-cov = "^5.0.0"
bandit = { extras = ["toml"], version = "^1.7.9" }
pip-audit = "^2.7.3"
respx = ">=0.21.0"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (AppSec rules)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # Allow assert in tests
    "S105", # Allow hardcoded test passwords/tokens in tests
    "S106", # Allow hardcoded test arguments in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pip_audit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra -q --cov=src/grc_tool --cov-report=term-missing --cov-fail-under=85"

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv"]
skips = []

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
